[project]
name = "inference-for-pecan"
version = "0.1.0"
description = "Video analysis of pecan half and piece area with an operator review dashboard"
readme = "README.md"
requires-python = ">=3.11, <=3.13"
dependencies = [
  "ultralytics>=8.3.196",
  "torch>=2.2.2",
  "torchvision>=0.17.2",
  "torchaudio>=2.2.2",
  "markupsafe<=3",
  "numpy<2,>=1.26.0",
  "dotenv>=0.9.9",
  "opencv-python",
  "pillow>=10",
]

# Platform-specific dependencies for GPU acceleration
[project.optional-dependencies]
cuda = [
  "nvidia-ml-py>=12",
]

[tool.setuptools.packages.find]
exclude = []
